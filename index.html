<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Botpress Chat Widget</title>
</head>
<body>

  <!-- Load Botpress Inject Script Dynamically & Wait for It -->
  <script>
  (function(d,t) {
    var BASE_URL="https://chatwoot.genomind.net";
    var g=d.createElement(t),s=d.getElementsByTagName(t)[0];
    g.src=BASE_URL+"/packs/js/sdk.js";
    g.defer = true;
    g.async = true;
    s.parentNode.insertBefore(g,s);
    g.onload=function(){
      window.chatwootSDK.run({
        websiteToken: 'LqQ8a47VXYBVQZ7gU18K6EdD',
        baseUrl: BASE_URL
      })
    }
  })(document,"script");
</script>


</body>
</html>
